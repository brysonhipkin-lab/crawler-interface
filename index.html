<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f16"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Crawler Interface</title><style>
:root{color-scheme:dark;--bg:#0b0f16;--panel:#171d28;--line:#303846;--red:#c62828;--muted:#a5afbd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f3f6;font:15px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:16px}header,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{font-weight:900;letter-spacing:2px;color:#f05a5a}.sub,small,label{color:var(--muted);font-size:12px}button,input,select,textarea{font:inherit;color:inherit;background:#222b39;border:1px solid #414b5b;border-radius:6px;padding:10px}button{cursor:pointer;min-height:42px}button:disabled{opacity:.4}button.active,.primary{background:var(--red);border-color:var(--red)}nav{display:flex;gap:5px;overflow-x:auto;margin:14px 0}nav button{flex:1;white-space:nowrap;padding:10px 8px;font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;min-width:0}h2{font-size:13px;letter-spacing:1.3px;color:#bfc8d4;margin:0 0 14px;text-transform:uppercase}h1{margin:0;font-size:25px}.identity{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center}.portrait{width:92px;height:92px;object-fit:cover;border-radius:8px;background:#293242;display:grid;place-items:center;font-size:32px}.meters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.meter{display:flex;gap:4px;height:16px;margin:10px 0}.meter i{flex:1;border-radius:3px;background:#303846}.mana{height:16px;background:#303846;border-radius:4px;overflow:hidden;margin:10px 0}.mana div{height:100%;background:#548be0}.value{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.spread{justify-content:space-between}.dashboard{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px}.stat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font-size:22px}.mod{color:#83d9a3;min-width:40px;text-align:right}.stack{display:grid;gap:12px;align-content:start}.hotbar{display:flex;gap:8px;flex-wrap:wrap}.slot{flex:1;min-width:76px;min-height:70px;border:1px dashed #4a5667;color:var(--muted);background:#111722}.empty{color:var(--muted);padding:12px 0}.bottom{margin-top:12px}dialog{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:12px;width:min(540px,94vw);max-height:90vh;overflow:auto}dialog::backdrop{background:#000b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:grid;gap:5px}.fields input{width:100%}textarea{width:100%;min-height:100px}footer{color:var(--muted);font-size:11px;margin-top:14px;text-align:center}.error{color:#ff8989}@media(max-width:760px){main{padding:10px}.dashboard,.meters{grid-template-columns:1fr}.identity{grid-template-columns:72px 1fr}.portrait{width:72px;height:72px}.identity>button{grid-column:1/-1}.fields{grid-template-columns:1fr}nav button{flex:none}}

/* Portrait-first layout */
main{max-width:820px;padding:16px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible;gap:6px}nav button{white-space:normal;min-width:0;padding:8px 4px} .dashboard{grid-template-columns:1fr 1fr;align-items:start}.dashboard>.stack{grid-column:1/-1;grid-row:2;grid-template-columns:1fr 1fr}.dashboard>.stack>.panel:first-child{grid-column:1/-1}.dashboard>.panel:last-child{grid-column:2;grid-row:1}.meters{grid-template-columns:1fr 1fr}.identity{grid-template-columns:92px minmax(0,1fr) auto}.identity>button{grid-column:auto}.portrait{width:92px;height:92px}.hotbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}.slot{min-width:0}header .row{max-width:100%}header select{max-width:100%}h1{overflow-wrap:anywhere}
@media(max-width:520px){main{padding:10px}.identity{grid-template-columns:72px minmax(0,1fr)}.portrait{width:72px;height:72px}.identity>button{grid-column:1/-1}.meters{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr}.dashboard>.panel:last-child{grid-column:1;grid-row:2}.dashboard>.stack{grid-column:1;grid-row:3;grid-template-columns:1fr}.hotbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
.statButton{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left}.statButton:hover{background:#222b39}.breakrow{display:grid;grid-template-columns:minmax(0,1fr) 75px 55px 55px;gap:6px;align-items:center;margin:8px 0}.breakrow input,.breakrow select{width:100%;min-width:0;padding:8px}.breakrow input[type=checkbox]{width:22px;height:22px;justify-self:center}.breakrow button{padding:5px}.breakhead{font-size:11px;color:var(--muted)}.breaktotal{font-size:24px;font-weight:bold;color:#83d9a3;margin:12px 0}.linkrow{margin:8px 0}.linkrow select{max-width:100%}dialog{width:min(620px,94vw)}
 .gearrow{display:grid;grid-template-columns:32px minmax(0,1fr) 76px 76px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.gearrow button{min-width:0;overflow-wrap:anywhere;padding:7px}.gearname{text-align:left;background:transparent}.handle{touch-action:none;cursor:grab;padding:4px!important}.gearhead{font-size:11px;color:var(--muted)}.gearsearch{width:100%;margin:8px 0}.gearrow input{width:100%;min-width:0;padding:6px}.gearrow.weapon{grid-template-columns:32px minmax(0,1fr) 65px minmax(90px,1fr)}.gearrow.equip{grid-template-columns:85px minmax(0,1fr) 80px}.gearrow.count{grid-template-columns:minmax(0,1fr) 80px 70px}.gearimage{max-width:100%;max-height:220px;object-fit:contain}.weaponbonus{display:grid;grid-template-columns:minmax(0,1fr) 58px minmax(90px,1fr) 48px 44px;gap:5px;align-items:center;margin:8px 0}.weaponbonus input{width:100%;min-width:0;padding:6px}.weaponbonus input[type=checkbox]{width:22px;height:22px;justify-self:center}.weaponbonus button{padding:4px}.capacity{height:12px;background:#303846;border-radius:4px;overflow:hidden;margin:10px 0}.capacity div{height:100%;background:#83d9a3}.gearform label{display:grid;gap:5px;margin:8px 0}.gearform textarea{min-height:65px}.gearform input{width:100%}.gearform input[type=checkbox]{width:22px}.gearrow.dragging{opacity:.5}.gearrow.target{outline:2px solid #f05a5a}button.primary{background:#237a42!important;border-color:#3b9b60!important}button[data-removegear]{background:#a32626!important;color:white!important}.weapon .mod{overflow-wrap:anywhere;white-space:normal}
.powerrow{display:grid;grid-template-columns:24px minmax(70px,1fr) repeat(4,minmax(32px,auto)) auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #303846}.powerrow.spellrow,.powerrow.gearhead:has(span:nth-child(5):last-child){grid-template-columns:24px minmax(70px,1fr) 45px minmax(60px,1fr) auto}.powerrow button{min-width:0}.powerrow .gearname{overflow-wrap:anywhere}.hotbar .slot{overflow-wrap:anywhere}.powerrow.skillrow{grid-template-columns:24px minmax(70px,1fr) 42px 42px 42px 56px}.powerrow.spellrow,.powerrow.gearhead.spellrow{grid-template-columns:24px minmax(70px,1fr) 45px minmax(60px,1fr) 56px}.powerrow>span:nth-child(n+3),.powerrow>strong{text-align:center}.powerrow>span{overflow-wrap:anywhere}#powerSearch{width:100%;margin-bottom:4px}.identity{grid-template-columns:92px minmax(0,1fr) auto auto}.progression{display:flex;gap:8px}.progressbox{display:grid;place-items:center;gap:4px;background:#222b39;border:1px solid #414b5b;border-radius:6px;padding:10px;min-width:68px}.progressbox strong{font-size:24px}.progressbox[data-exp-open] strong{color:#83d9a3}.xpkeys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.xpkeys button{font-size:20px}.xptotal{text-align:center;margin:16px 0}.xptotal strong{display:block;font-size:32px;color:#83d9a3}@media(max-width:650px){.identity{grid-template-columns:72px minmax(0,1fr)}.identity .portrait{width:72px;height:72px}.identity>.progression{grid-column:1/-1}.progressbox{flex:1}.identity>button{grid-column:1/-1}}</style></head><body><main><header><div><div class="brand">MERIDIAN INDUSTRIES</div><div class="sub">CRAWLER INTERFACE / STAGE 04 · PORTRAIT</div></div><div class="row"><select id="profiles" aria-label="Character profile"></select><button id="newProfile">+ Character</button></div></header><nav id="nav"></nav><section id="content"></section><footer id="status"></footer></main><dialog id="modal"></dialog><script>
'use strict';
const $=id=>document.getElementById(id), KEY='meridianCrawlerInterfaceV1', attrs=['STR','DEX','CON','INT','WIS','LUCK','CHA'], stats=['AC','Attack Bonus','Movement','Perception','Initiative'], tabs=['Character','Inventory','Equipment','Skills','Spells & Abilities','Companion','Currency','Notes','Settings'];
const blank=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:'',number:'',race:'',className:'',level:1,floor:1,exp:0,portrait:'',health:100,mana:0,maxMana:0,attributes:Object.fromEntries(attrs.map(a=>[a,10])),combat:Object.fromEntries(stats.map(a=>[a,0])),inspiration:false,buffs:'',resistances:'',hotbar:5,notes:''});
let db;try{db=JSON.parse(localStorage.getItem(KEY));if(!db||!Array.isArray(db.profiles)||!db.profiles.length)throw Error()}catch{let p=blank();db={active:p.id,profiles:[p]}}let tab='Character',undo=null;let companionId=null;const owner=()=>db.profiles.find(p=>p.id===db.active)||db.profiles[0];const current=()=>owner().companions?.find(p=>p.id===companionId)||owner();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v,min=0,max=1e9)=>Math.min(max,Math.max(min,Math.trunc(Number(v)||0)));const signed=v=>v>=0?'+'+v:String(v);
const bonusRows=(p,k,a)=>p.breakdowns?.[k]?.[a]||[];
const total=(p,k,a)=>Number((k==='attr'?p.attributes:p.combat)[a]||0)+bonusRows(p,k,a).filter(r=>r.enabled).reduce((sum,r)=>sum+Number(r.value||0)+(k==='stat'&&attrs.includes(r.link)?modifier(p,r.link):0),0);
const modifier=(p,a)=>Math.floor((total(p,'attr',a)-10)/2);
let storage=null, pending=Promise.resolve(), storageReady=false;
function statusMessage(message,error=false){$('status').textContent=message;$('status').className=error?'error':''}
function writeSnapshot(snapshot){if(!storage){localStorage.setItem(KEY,snapshot);return Promise.resolve()}return new Promise((resolve,reject)=>{const tx=storage.transaction('state','readwrite');tx.objectStore('state').put(snapshot,'main');tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(tx.error||Error('Storage transaction failed'))})}
function persist(snapshot){const task=pending.catch(()=>{}).then(()=>writeSnapshot(snapshot));pending=task;return task}
function save(){if(!storageReady)return;statusMessage('SAVING…');persist(JSON.stringify(db)).then(()=>statusMessage('LOCAL DATA SAVED • VERSION 1.0'+(storage?' • IndexedDB':' • localStorage fallback')),()=>statusMessage('SAVE FAILED — export a backup now',true))}
async function initStorage(){try{storage=await new Promise((resolve,reject)=>{const req=indexedDB.open('meridianCrawlerInterfaceDB',1);req.onupgradeneeded=()=>req.result.createObjectStore('state');req.onsuccess=()=>resolve(req.result);req.onerror=req.onblocked=()=>reject(Error('Database unavailable'))});const saved=await new Promise((resolve,reject)=>{const req=storage.transaction('state').objectStore('state').get('main');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(saved){const next=JSON.parse(saved);if(!Array.isArray(next.profiles)||!next.profiles.length)throw Error('Invalid stored data');db=next}else await writeSnapshot(JSON.stringify(db));}catch(err){if(storage){storage.close();storage=null;statusMessage('DATABASE READ OR MIGRATION FAILED — restore from backup before continuing',true);return} }storageReady=true;document.querySelectorAll('#profiles,#newProfile').forEach(el=>el.disabled=false);save();render()}

function change(fn){undo={id:current().id,data:JSON.stringify(current())};fn(current());save();render()}
function renderBase(){let p=current();$('profiles').innerHTML=db.profiles.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?'selected':''}>${esc(x.name||'Unnamed crawler')}</option>`).join('');$('nav').innerHTML=tabs.map(t=>`<button data-tab="${esc(t)}" class="${t===tab?'active':''}">${esc(t)}</button>`).join('');let c=$('content');if(tab==='Character'){c.innerHTML=`<div class="panel identity">${p.portrait?`<img class="portrait" src="${esc(p.portrait)}" alt="Character portrait">`:'<div class="portrait">◇</div>'}<div><small>CRAWLER ${esc(p.number||'—')} · FLOOR ${p.floor}</small><h1>${esc(p.name||'Unnamed crawler')}</h1><div>${esc(p.race||'Race')} / ${esc(p.className||'Class')}</div></div><div class="progression"><div class="progressbox"><small>LEVEL</small><strong>${p.level}</strong></div><button class="progressbox" data-exp-open><small>EXP</small><strong>${Number(p.exp||0).toLocaleString()}</strong></button></div><button data-action="edit">Edit Character</button></div><div class="meters"><div class="panel"><div class="row spread"><h2>Health</h2><span class="value">${p.health}%</span></div><div class="meter">${Array.from({length:10},(_,i)=>`<i style="background:${p.health>(i*10)?`hsl(${i*13},65%,45%)`:'#303846'}"></i>`).join('')}</div><div class="row"><button data-hp="-10">−10%</button><button data-hp="10">+10%</button></div></div><div class="panel"><div class="row spread"><h2>Mana</h2><button data-action="mana" class="value">${p.mana} / ${p.maxMana}</button></div><div class="mana"><div style="width:${p.maxMana?100*p.mana/p.maxMana:0}%"></div></div><div class="row">${[-5,-1,1,5].map(n=>`<button data-mana="${n}">${signed(n)}</button>`).join('')}</div></div></div><div class="dashboard"><div class="panel"><h2>Attributes</h2>${attrs.map(a=>`<button class="stat statButton" data-break="attr" data-key="${a}"><span>${a}</span><strong>${total(p,'attr',a)}</strong><span class="mod">${signed(modifier(p,a))}</span></button>`).join('')}</div><div class="stack"><div class="panel"><h2>Weapons & Attacks</h2>${weaponsView(p)}</div><div class="panel"><h2>Buffs & Debuffs</h2><div style="white-space:pre-wrap">${statusView(p,'buffs')}</div></div><div class="panel"><h2>Resistances & Vulnerabilities</h2><div style="white-space:pre-wrap">${statusView(p,'resistances')}</div></div></div><div class="panel"><h2>Combat Statistics</h2>${stats.map(a=>`<button class="stat statButton" data-break="stat" data-key="${a}"><span>${a}</span><strong>${total(p,'stat',a)}${a==='Movement'?' ft':''}</strong></button>`).join('')}<div class="stat"><span>Inspiration</span><button data-action="inspiration" style="color:${p.inspiration?'#ffd34e':'#657080'};font-size:24px">★</button></div></div></div><div class="panel bottom"><div class="row spread"><h2>Quick Access</h2><button data-action="undo" ${undo&&undo.id===p.id?'':'disabled'}>Undo</button></div><div class="hotbar">${hotView(p)}</div></div>`}else if(tab==='Inventory'||tab==='Equipment'){c.innerHTML=gearView(p,tab);wireGear()}else if(tab==='Skills'||tab==='Spells & Abilities'){let k=tab==='Skills'?'skills':'spells';c.innerHTML=powersView(p,k);$('powerSearch').oninput=e=>{$('powerRows').innerHTML=powerRows(p,k,e.target.value)}}else if(tab==='Currency'){c.innerHTML=currencyView(p)}else if(tab==='Settings'){settingsView(p)}else if(tab==='Notes'){c.innerHTML=`<div class="panel"><h2>Personal Notes</h2><textarea id="notes" style="min-height:55vh" placeholder="Quest notes, discoveries and reminders">${esc(p.notes)}</textarea></div>`;$('notes').oninput=e=>{p.notes=e.target.value;undo=null;save()}}else{c.innerHTML=`<div class="panel"><h2>${esc(tab)}</h2><p class="empty">This page is reserved for a later development stage.</p></div>`}}
function field(label,key,value,type='text'){return `<label>${esc(label)}<input name="${esc(key)}" type="${type}" value="${esc(value)}" ${type==='number'?'step="1"':''}></label>`}
function edit(){let p=current(),m=$('modal');m.innerHTML=`<form id="editForm"><h2>Edit Character</h2><div class="fields">${field('Name','name',p.name)}${field('Crawler number','number',p.number)}${field('Race','race',p.race)}${field('Class','className',p.className)}${field('Level','level',p.level,'number')}${field('Floor','floor',p.floor,'number')}${field('Experience','exp',p.exp,'number')}<label>Portrait<input type="file" id="portraitFile" accept="image/*"></label><label><span>Remove portrait</span><input type="checkbox" name="removePortrait"></label>${attrs.map(a=>field(a+' base','attr_'+a,p.attributes[a],'number')).join('')}${stats.map(a=>field(a+' base','stat_'+a,p.combat[a],'number')).join('')}</div><p><label>Buffs & Debuffs<textarea name="buffs">${esc(p.buffs)}</textarea></label></p><p><label>Resistances & Vulnerabilities<textarea name="resistances">${esc(p.resistances)}</textarea></label></p><div class="row"><button class="primary" type="submit">Save changes</button><button type="button" data-action="close">Cancel</button></div></form>`;m.showModal();$('editForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=$('portraitFile').files[0],portrait=f.has('removePortrait')?'':p.portrait;try{if(file)portrait=await resize(file)}catch{alert('Unable to read portrait.');return}for(let k of ['name','number','race','className','buffs','resistances'])p[k]=String(f.get(k));for(let k of ['level','floor','exp'])p[k]=num(f.get(k),k==='exp'?0:1);for(let a of attrs)p.attributes[a]=num(f.get('attr_'+a),0,999);for(let a of stats)p.combat[a]=num(f.get('stat_'+a),-999,9999);p.portrait=portrait;undo=null;m.close();save();render()}}
async function resize(file){let url=URL.createObjectURL(file);try{let im=new Image();im.src=url;await im.decode();let s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}finally{URL.revokeObjectURL(url)}}
function breakdown(k,a){let p=current(),m=$('modal'),base=Number((k==='attr'?p.attributes:p.combat)[a]),rows=JSON.parse(JSON.stringify(bonusRows(p,k,a)));m.innerHTML=`<h2>${esc(a)} breakdown</h2><label>Base value <input id="baseValue" type="number" step="1" value="${base}"></label><div id="breakTotal" class="breaktotal"></div><div class="breakrow breakhead"><span>Source</span><span>Value</span><span>Enable</span><span>Delete</span></div><div id="breakRows"></div><div class="row"><button id="addBonus">+ Add modifier</button>${k==='stat'?'<button id="addLink">+ Link attribute</button>':''}</div><p class="row"><button id="saveBreak" class="primary">Save changes</button><button data-action="close">Cancel</button></p>`;
function preview(){let t=Number($('baseValue').value||0)+rows.filter(r=>r.enabled).reduce((sum,r)=>sum+Number(r.value||0)+(k==='stat'&&attrs.includes(r.link)?modifier(p,r.link):0),0);$('breakTotal').textContent='Total: '+t+(k==='attr'?'  |  Modifier: '+signed(Math.floor((t-10)/2)):'');}
function draw(){ $('breakRows').innerHTML=rows.map((r,i)=>`<div class="breakrow"><div><input aria-label="Source" data-i="${i}" data-field="source" value="${esc(r.source)}" placeholder="Source">${r.link!==undefined?`<select aria-label="Linked attribute" data-i="${i}" data-field="link">${attrs.map(x=>`<option ${x===r.link?'selected':''}>${x}</option>`).join('')}</select>`:''}</div><input aria-label="Value" type="number" step="1" data-i="${i}" data-field="value" value="${r.value}"><input aria-label="Enable" type="checkbox" data-i="${i}" data-field="enabled" ${r.enabled?'checked':''}><button aria-label="Delete modifier" data-delete="${i}">×</button></div>`).join('');preview()}
$('breakRows').oninput=e=>{let d=e.target.dataset;if(d.field){rows[Number(d.i)][d.field]=d.field==='enabled'?e.target.checked:d.field==='value'?num(e.target.value,-9999,9999):e.target.value;preview()}};$('breakRows').onclick=e=>{let d=e.target.dataset;if(d.delete!==undefined){rows.splice(Number(d.delete),1);draw()}};$('baseValue').oninput=preview;$('addBonus').onclick=()=>{rows.push({source:'',value:0,enabled:true});draw()};if(k==='stat')$('addLink').onclick=()=>{rows.push({source:'Attribute modifier',value:0,enabled:true,link:'DEX'});draw()};$('saveBreak').onclick=()=>{let v=num($('baseValue').value,k==='attr'?0:-999,k==='attr'?999:9999);m.close();change(p=>{(k==='attr'?p.attributes:p.combat)[a]=v;p.breakdowns??={};p.breakdowns[k]??={};p.breakdowns[k][a]=rows})};draw();m.showModal()}
function manaEdit(){let m=$('modal');m.innerHTML=`<form id="manaForm"><h2>Maximum Mana</h2><input name="max" type="number" inputmode="numeric" min="0" max="999999" value="${current().maxMana}" required><p class="row"><button class="primary">Save</button><button type="button" data-action="close">Cancel</button></p></form>`;m.showModal();$('manaForm').onsubmit=e=>{e.preventDefault();let v=num(new FormData(e.target).get('max'),0,999999);m.close();change(p=>{p.maxMana=v;p.mana=Math.min(p.mana,v)})}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.break){breakdown(d.break,d.key)}else if(d.tab){companionId=null;undo=null;tab=d.tab;render()}else if(d.hp!==undefined)change(p=>p.health=num(p.health+Number(d.hp),0,100));else if(d.mana!==undefined)change(p=>p.mana=num(p.mana+Number(d.mana),0,p.maxMana));else if(d.action==='edit')edit();else if(d.action==='mana')manaEdit();else if(d.action==='close')$('modal').close();else if(d.action==='inspiration')change(p=>p.inspiration=!p.inspiration);else if(d.action==='undo'&&undo&&undo.id===current().id){let list=companionId?owner().companions:db.profiles;list[list.findIndex(p=>p.id===undo.id)]=JSON.parse(undo.data);undo=null;save();render()}});

const equipmentSlots=['Head','Torso','Gloves','Legs','Boots','Main Hand','Off Hand','Accessory 1','Accessory 2','Accessory 3'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
function gear(p){p.gear??={};let g=p.gear;for(let k of ['weapons','inventory','consumables','ammo','skills','spells'])g[k]??=[];g.capacity??=0;g.equipment??=equipmentSlots.map(slot=>({id:uid(),slot,name:'',equipped:false}));return g}

function hotOpen(i,assign=false){let p=current(),m=$('modal'),entries=hotEntries(p),r=p.hotRefs?.[i],e=entries.find(x=>x.k===r?.k&&x.w.id===r?.id);if(!e||assign){m.innerHTML=`<h2>Assign hotbar slot ${i+1}</h2><select id="hotChoice"><option value="">Empty</option>${entries.map((x,j)=>`<option value="${j}" ${x===e?'selected':''}>${esc(x.w.name)} (${esc(x.k)})</option>`).join('')}</select><div class="row"><button class="primary" id="hotSave">Save changes</button><button data-action="close">Cancel</button></div>`;$('hotSave').onclick=()=>{let v=$('hotChoice').value,x=v===''?null:entries[Number(v)];m.close();change(p=>{p.hotRefs??={};p.hotRefs[i]=x?{k:x.k,id:x.w.id}:null})}}else{let {w,k}=e,skill=k==='skills',spell=k==='spells',cons=['consumables','ammo'].includes(k);m.innerHTML=`<h2>${esc(w.name)}</h2><p>${esc(w.description||'')}</p><p>${esc(skill?'Modifier '+signed(skillMod(p,w))+' · Uses '+w.uses:spell?'Mana '+w.cost+' · Damage '+(w.damage||'—')+' · Saving throw '+(w.savingThrow||'—'):cons?'Quantity '+w.quantity:weaponTotals(w,p).join(' · '))}</p><p>${esc(w.weaponNotes||w.notes||'')}</p><div class="row">${skill||spell||cons?`<button class="primary" data-poweruse="${k}" data-id="${w.id}" ${(spell&&p.mana<w.cost)||(cons&&w.quantity<=0)?'disabled':''}>${spell?'CAST':'USE'}</button>`:''}<button data-hotassign="${i}">Change assignment</button><button data-action="close">Close</button></div>`}if(!m.open)m.showModal()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;let d=b.dataset;if(d.poweradd)powerEdit(d.poweradd);else if(d.power)powerEdit(d.power,d.id);else if(d.poweruse)usePower(d.poweruse,d.id);else if(d.powerdelete&&confirm('Delete this entry?')){$('modal').close();change(p=>{gear(p)[d.powerdelete]=gear(p)[d.powerdelete].filter(x=>x.id!==d.id)})}else if(d.hot!==undefined)hotOpen(Number(d.hot));else if(d.hotassign!==undefined)hotOpen(Number(d.hotassign),true)});

function expOpen(){const m=$('modal'),p=current();let amount='';const fmt=n=>Number(n).toLocaleString();function draw(adding){m.innerHTML=`<h2>Experience</h2><div class="xptotal"><small>TOTAL EXPERIENCE</small><strong>${fmt(p.exp||0)}</strong></div>${adding?`<div class="xptotal"><small>EXPERIENCE AWARDED</small><strong id="xpAmount">0</strong></div><div class="xpkeys">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(k=>`<button data-xpkey="${k}">${k}</button>`).join('')}</div><p class="row spread"><small>NEW TOTAL</small><strong id="xpPreview">${fmt(p.exp||0)}</strong></p><button class="primary" id="xpSave" disabled>Save Experience</button>`:'<button class="primary" id="xpAdd">+ ADD EXP</button>'} <button data-action="close">Close</button>`;if(!adding){$('xpAdd').onclick=()=>draw(true);return}const update=()=>{$('xpAmount').textContent=fmt(amount);$('xpPreview').textContent=fmt(Number(p.exp||0)+Number(amount));$('xpSave').disabled=Number(amount)<=0||Number(p.exp||0)+Number(amount)>1e9};m.querySelectorAll('[data-xpkey]').forEach(b=>b.onclick=()=>{let k=b.dataset.xpkey;amount=k==='C'?'':k==='⌫'?amount.slice(0,-1):(amount+k).slice(0,9);update()});$('xpSave').onclick=()=>{if($('xpSave').disabled)return;m.close();change(x=>{x.exp=Number(x.exp||0)+Number(amount)})}}draw(false);m.showModal()}
document.addEventListener('click',e=>{if(e.target.closest('[data-exp-open]'))expOpen()});

function render(){
 renderBase();backupReminder();
 if(tab!=='Companion'&&!companionId)return;
 const o=owner(), list=o.companions||[], c=$('content');
 $('profiles').value=o.id;
 $('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='Companion'));
 const panel=document.createElement('div');panel.className='panel bottom';
 panel.innerHTML=`<div class="row spread"><h2>Companions · ${esc(o.name||'Unnamed crawler')}</h2><button class="primary" id="compAdd">+ Add Companion</button></div><div class="row" style="flex-wrap:wrap">${list.map(x=>`<button data-comp-select="${esc(x.id)}" class="${x.id===companionId?'primary':''}">${esc(x.name||'Unnamed companion')}</button>`).join('')}</div>${companionId?`<div class="row" style="flex-wrap:wrap;margin-top:12px">${['Character','Skills','Spells & Abilities','Inventory','Equipment','Notes'].map(t=>`<button data-comp-tab="${esc(t)}" class="${tab===t?'primary':''}">${t==='Character'?'Overview':esc(t)}</button>`).join('')}<button id="compDelete" style="background:#a32626">Delete Companion</button></div>`:'<p>Select a companion or add a new one.</p>'}`;
 if(!companionId)c.innerHTML='';c.prepend(panel);
 $('compAdd').onclick=()=>{let p=blank();p.name='New companion';(o.companions??=[]).push(p);companionId=p.id;tab='Character';undo=null;save();render()};
 panel.querySelectorAll('[data-comp-select]').forEach(b=>b.onclick=()=>{companionId=b.dataset.compSelect;tab='Character';undo=null;render()});
 panel.querySelectorAll('[data-comp-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.compTab;render()});
 if(companionId){$('compDelete').onclick=()=>{if(!confirm('Delete this companion and all its data?'))return;o.companions=o.companions.filter(x=>x.id!==companionId);companionId=null;tab='Companion';undo=null;save();render()};let identity=c.querySelector('.identity');if(identity){let small=identity.querySelector('small');if(small)small.textContent='COMPANION';let b=identity.querySelector('[data-action=edit]');if(b)b.textContent='Edit Companion';}}
}


function currencyView(p){return `<div class="panel"><div class="row spread"><h2>Currency</h2><button data-action="undo" ${undo&&undo.id===p.id?'':'disabled'}>Undo</button></div><div class="meters">${['gold','credits'].map(k=>`<button class="progressbox" style="padding:24px;color:${k==='gold'?'#ffd34e':'#8ac9ff'}" data-currency="${k}"><small>${k.toUpperCase()}</small><strong>${Number(p.currency?.[k]||0).toLocaleString()}</strong></button>`).join('')}</div><p class="empty">Select a balance to add or spend currency.</p></div>`}
function currencyOpen(k){const m=$('modal'),p=current(),balance=Number(p.currency?.[k]||0),fmt=n=>Number(n).toLocaleString();let amount='',mode='';function draw(){m.innerHTML=`<h2>${k==='gold'?'Gold':'Credits'}</h2><div class="xptotal"><small>CURRENT BALANCE</small><strong>${fmt(balance)}</strong></div>${mode?`<div class="xptotal"><small>${mode==='add'?'ADD':'SPEND'} AMOUNT</small><strong id="currencyAmount">0</strong></div><div class="xpkeys">${['1','2','3','4','5','6','7','8','9','C','0','⌫'].map(n=>`<button data-moneykey="${n}">${n}</button>`).join('')}</div><p class="row spread"><small>NEW BALANCE</small><strong id="currencyPreview">${fmt(balance)}</strong></p><p id="currencyError" style="color:#ff8585"></p><button class="primary" id="currencySave" disabled>Save Transaction</button>`:`<div class="row"><button class="primary" id="moneyAdd">+ ADD</button><button id="moneySpend">− SPEND</button></div>`}<button data-action="close">Close</button>`;if(!mode){$('moneyAdd').onclick=()=>{mode='add';draw()};$('moneySpend').onclick=()=>{mode='spend';draw()};return}const next=()=>balance+(mode==='add'?1:-1)*Number(amount);function update(){$('currencyAmount').textContent=fmt(amount);$('currencyPreview').textContent=fmt(next());$('currencyError').textContent=next()<0?'Insufficient funds':!Number.isSafeInteger(next())?'Balance too large':'';$('currencySave').disabled=Number(amount)<=0||next()<0||!Number.isSafeInteger(next())}m.querySelectorAll('[data-moneykey]').forEach(b=>b.onclick=()=>{let n=b.dataset.moneykey;amount=n==='C'?'':n==='⌫'?amount.slice(0,-1):(amount+n).slice(0,12);update()});$('currencySave').onclick=()=>{if($('currencySave').disabled)return;m.close();change(x=>{(x.currency??={})[k]=next()})}}draw();m.showModal()}
function statusView(p,k){const rows=p.statusEntries?.[k]||[];return `${esc(p[k]||'')}${rows.map((r,i)=>`<button data-status="${k}" data-index="${i}" style="display:block;width:100%;text-align:left;margin:5px 0;color:${({Buff:'#83d9a3',Debuff:'#ff8585',Resistance:'#83d9a3',Immunity:'#8ac9ff',Vulnerability:'#ff8585'})[r.type]||'#fff'}"><strong>${esc(r.name)}</strong> · ${esc(r.type)}${r.value?' · '+esc(r.value):''}</button>`).join('')}${!p[k]&&!rows.length?'<small>None recorded</small>':''}<button data-status="${k}" data-index="-1" style="display:block;margin-top:8px">+ Add ${k==='buffs'?'Effect':'Resistance / Vulnerability'}</button>`}
function statusEdit(k,i){const p=current(),m=$('modal'),r=p.statusEntries?.[k]?.[i]||{},types=k==='buffs'?['Buff','Debuff']:['Resistance','Immunity','Vulnerability'];m.innerHTML=`<form id="statusForm"><h2>${i<0?'Add':'Edit'} ${k==='buffs'?'Effect':'Damage Modifier'}</h2><label>Name<input name="name" required value="${esc(r.name||'')}"></label><label>Type<select name="type">${types.map(t=>`<option ${r.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label>${k==='buffs'?'Effect / Duration':'Amount (e.g. 50%)'}<input name="value" value="${esc(r.value||'')}"></label><label>Notes<textarea name="notes">${esc(r.notes||'')}</textarea></label><div class="row"><button class="primary" type="submit">Save Changes</button>${i>=0?'<button type="button" id="statusDelete" style="background:#a32626">Delete</button>':''}<button type="button" data-action="close">Cancel</button></div></form>`;m.showModal();$('statusForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));m.close();change(x=>{const a=((x.statusEntries??={})[k]??=[]);if(i<0)a.push(v);else a[i]=v})};if(i>=0)$('statusDelete').onclick=()=>{if(!confirm('Delete this entry?'))return;m.close();change(x=>x.statusEntries[k].splice(i,1))}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-currency]'),a=e.target.closest('[data-status]');if(b)currencyOpen(b.dataset.currency);if(a)statusEdit(a.dataset.status,Number(a.dataset.index))});


function downloadData(data,name){const u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function backupStamp(p){p.lastBackup=Date.now();p.dismissedBackup=0}
function validProfile(p){return p&&typeof p==='object'&&typeof p.id==='string'&&typeof p.name==='string'&&p.attributes&&p.combat&&Number.isInteger(p.hotbar)&&p.hotbar>=1&&p.hotbar<=100&&(!p.companions||(Array.isArray(p.companions)&&p.companions.every(validProfile)))&&(!p.gear||['weapons','inventory','consumables','ammo','skills','spells','equipment'].every(k=>p.gear[k]===undefined||Array.isArray(p.gear[k])))}
async function commitDB(next){try{await persist(JSON.stringify(next))}catch{alert('Storage write failed. Existing data has not been changed.');return false}db=next;companionId=null;undo=null;tab='Character';render();return true}
function settingsView(p){$('content').innerHTML=`<div class="panel"><h2>Character Sharing</h2><p>Export this crawler and all companions, images and equipment.</p><div class="row"><button class="primary" id="exportChar">Export Character</button><button id="importChar">Import Character</button></div><input hidden type="file" accept=".json,application/json" id="importFile"></div><div class="panel bottom"><h2>Backups</h2><p>Last backup: ${p.lastBackup?esc(new Date(p.lastBackup).toLocaleString()):'Never'}</p><div class="row"><button class="primary" id="backupAll">Back Up All Characters</button><button id="restoreAll">Restore Full Backup</button></div><p class="empty">Keep backup files somewhere safe. Restoring a full backup replaces local profiles.</p></div><div class="panel bottom"><h2>Quick Access Slots</h2><p>${p.hotbar} slots</p><div class="row"><button id="slotAdd" ${p.hotbar>=100?'disabled':''}>+ Add Slot</button><button id="slotRemove" ${p.hotbar<=1?'disabled':''}>− Remove Last Slot</button></div></div><div class="panel bottom"><h2>Character Management</h2><button id="deleteProfile" style="background:#a32626">Delete Character</button></div><div class="panel bottom"><h2>Offline Access</h2><p>${location.protocol==='file:'?'This local HTML file works offline. Hosted offline caching requires HTTPS and the service worker.':'Offline caching is available when the service worker is installed.'}</p></div>`;
$('exportChar').onclick=()=>{backupStamp(p);save();downloadData({format:'meridian-character',version:1,profile:p},(p.name||'crawler').replace(/[^a-z0-9_-]/gi,'_')+'.json');render()};
$('backupAll').onclick=()=>{db.profiles.forEach(backupStamp);save();downloadData({format:'meridian-backup',version:1,db},'crawler-backup-'+new Date().toISOString().slice(0,10)+'.json');render()};
$('slotAdd').onclick=()=>change(x=>x.hotbar++);$('slotRemove').onclick=()=>{if(p.hotRefs?.[p.hotbar-1]&&!confirm('Remove the last slot and its assignment?'))return;change(x=>{if(x.hotRefs)delete x.hotRefs[x.hotbar-1];x.hotbar--})};
$('deleteProfile').onclick=()=>{if(!confirm('Permanently delete '+(p.name||'this crawler')+' and all companions?'))return;const profiles=db.profiles.filter(x=>x.id!==p.id);if(!profiles.length)profiles.push(blank());commitDB({...db,profiles,active:profiles[0].id})};
let mode='';$('importChar').onclick=()=>{mode='character';$('importFile').click()};$('restoreAll').onclick=()=>{mode='backup';$('importFile').click()};$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.version!==1)throw Error('Unsupported file version');if(mode==='character'){if(d.format!=='meridian-character'||!validProfile(d.profile))throw Error('Invalid character file');const q=d.profile;q.id=blank().id;commitDB({...db,active:q.id,profiles:[...db.profiles,q]})}else{if(d.format!=='meridian-backup'||!Array.isArray(d.db?.profiles)||!d.db.profiles.length||!d.db.profiles.every(validProfile)||new Set(d.db.profiles.map(x=>x.id)).size!==d.db.profiles.length)throw Error('Invalid backup file');if(!confirm('Replace ALL local characters with this backup?'))return;commitDB(d.db)}}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};
}
function backupReminder(){if(tab!=='Character'||companionId)return;const p=owner(),now=Date.now(),week=604800000;if(!p.createdAt){p.createdAt=now;save()}if(now-Math.max(p.lastBackup||p.createdAt,p.dismissedBackup||0)<week)return;const el=document.createElement('div');el.className='panel bottom';el.innerHTML='<div class="row spread"><small>Backup reminder: export your character to protect your progress.</small><button id="backupGo">Settings</button><button id="backupDismiss">Dismiss</button></div>';$('content').append(el);$('backupGo').onclick=()=>{tab='Settings';render()};$('backupDismiss').onclick=()=>{p.dismissedBackup=now;save();el.remove()}}

$('profiles').onchange=e=>{db.active=e.target.value;companionId=null;undo=null;tab='Character';save();render()};$('newProfile').onclick=()=>{let p=blank();db.profiles.push(p);db.active=p.id;companionId=null;undo=null;tab='Character';save();render()};document.querySelectorAll('#profiles,#newProfile').forEach(el=>el.disabled=true);statusMessage('LOADING CHARACTER DATA…');initStorage();
if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(console.warn);
</script></body></html>
